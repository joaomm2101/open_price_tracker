[project]
name = "open-price-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joao", email = "258579401+joaomm2101@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
open-price-tracker = "open_price_tracker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
