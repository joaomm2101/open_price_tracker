name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  postgres:
    name: Tests and migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_price_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/open_price_tracker
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/open_price_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrations apply and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: Create test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE open_price_tracker_test"
        env:
          PGPASSWORD: postgres
      - run: uv run pytest -q
